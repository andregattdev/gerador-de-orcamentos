spring.application.name=gerador_de_orcamento

spring.datasource.url=jdbc:postgresql://localhost:5432/api-gerador-de-orcamento
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

logging.level.org.springframework=ERROR
logging.level.com.app=INFO

# Diretório para armazenamento dos PDFs gerados
app.pdf.storage-path=./orcamentos
